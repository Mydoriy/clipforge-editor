name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Lint Check
        run: npm run lint

      - name: 1b. i18n Translation Parity Check
        run: npm run check:i18n

      - name: 2. TypeScript Strict Check
        run: npm run typecheck

      - name: 3. Vitest Pure Logic Unit Tests
        run: npm run test:vitest

      - name: 4. Native Node Verification Tests
        run: npm test

      - name: 5. Vite Production Build
        run: npm run build

      - name: 6. Install Playwright Browsers & Run E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
